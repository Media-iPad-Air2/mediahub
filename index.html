<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Media Hub</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Media Hub">
<meta name="theme-color" content="#020617">

<style>

:root{
    --bg:#020617;
    --bg2:#0f172a;
    --glass:rgba(255,255,255,.08);
    --glass-hover:rgba(255,255,255,.14);
    --text:#ffffff;
    --muted:#94a3b8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{

    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;

    color:white;

    background:
        radial-gradient(circle at top right,#1d4ed833 0%,transparent 30%),
        radial-gradient(circle at bottom left,#7c3aed22 0%,transparent 35%),
        linear-gradient(180deg,var(--bg),var(--bg2));

    min-height:100vh;
}

.container{

    padding:24px;

    max-width:1400px;

    margin:auto;
}

/* HERO */

.hero{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    margin-bottom:25px;
}

.clock{

    font-size:5rem;

    font-weight:700;

    line-height:1;

    letter-spacing:-4px;
}

.date{

    color:var(--muted);

    margin-top:8px;
}

.status{

    margin-top:12px;

    display:inline-block;

    padding:10px 16px;

    border-radius:999px;

    background:var(--glass);

    border:1px solid rgba(255,255,255,.08);
}

.side{

    display:flex;

    flex-direction:column;

    gap:12px;
}

.pill{

    background:var(--glass);

    border:1px solid rgba(255,255,255,.08);

    border-radius:999px;

    padding:12px 20px;

    text-align:center;
}

/* GRID */

.grid{

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:16px;
}

.tile{

    min-height:140px;

    background:var(--glass);

    border:1px solid rgba(255,255,255,.08);

    border-radius:28px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-decoration:none;

    color:white;

    transition:.2s;
}

.tile:hover{

    transform:translateY(-3px);

    background:var(--glass-hover);
}

.wide{
    grid-column:span 2;
}

.icon{

    font-size:2rem;

    margin-bottom:10px;
}

.label{

    font-size:1rem;

    font-weight:600;
}

.sub{

    font-size:.8rem;

    color:var(--muted);

    margin-top:4px;
}

.spotify{
    border-left:4px solid #1DB954;
}

.netflix{
    border-left:4px solid #E50914;
}

.youtube{
    border-left:4px solid #FF0000;
}

.tapo{
    border-left:4px solid #06b6d4;
}

.hue{
    border-left:4px solid #facc15;
}

@media(max-width:1000px){

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .clock{
        font-size:4rem;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="hero">

        <div>

            <div id="greeting">
                Bienvenido
            </div>

            <div id="clock" class="clock">
                00:00
            </div>

            <div id="date" class="date">
            </div>

            <div class="status">
                🏠 Aldaia · 📶 Online
            </div>

        </div>

        <div class="side">

            <div class="pill">
                 Media Hub
            </div>

            <div class="pill">
                🌙 Modo oscuro
            </div>

        </div>

    </div>

    <div class="grid">

        <a class="tile wide spotify" href="https://open.spotify.com">
            <div class="icon">♫</div>
            <div class="label">Spotify</div>
            <div class="sub">Música</div>
        </a>

        <a class="tile wide netflix" href="https://www.netflix.com">
            <div class="icon">N</div>
            <div class="label">Netflix</div>
            <div class="sub">Series y películas</div>
        </a>

        <a class="tile youtube" href="https://youtube.com">
            <div class="icon">▶</div>
            <div class="label">YouTube</div>
        </a>

        <a class="tile" href="https://www.disneyplus.com">
            <div class="icon">⭐</div>
            <div class="label">Disney+</div>
        </a>

        <a class="tile" href="https://www.primevideo.com">
            <div class="icon">📺</div>
            <div class="label">Prime Video</div>
        </a>

        <a class="tile tapo" href="https://www.tapo.com">
            <div class="icon">📹</div>
            <div class="label">Tapo</div>
        </a>

        <div class="tile hue">
            <div class="icon">💡</div>
            <div class="label">Hue</div>
        </div>

        <div class="tile">
            <div class="icon">🎬</div>
            <div class="label">Modo Cine</div>
        </div>

        <a class="tile" href="https://news.google.com">
            <div class="icon">📰</div>
            <div class="label">Noticias</div>
        </a>

        <a class="tile" href="https://www.eltiempo.es">
            <div class="icon">☁️</div>
            <div class="label">Tiempo</div>
        </a>

        <a class="tile" href="https://www.rtve.es/play">
            <div class="icon">📡</div>
            <div class="label">RTVE Play</div>
        </a>

        <div class="tile">
            <div class="icon">🏠</div>
            <div class="label">Casa</div>
        </div>

    </div>

</div>

<script>

function actualizarReloj(){

    const ahora = new Date();

    const hora = ahora.getHours();

    let saludo = "Buenas noches";

    if(hora >= 6 && hora < 12){
        saludo = "Buenos días";
    }
    else if(hora >= 12 && hora < 20){
        saludo = "Buenas tardes";
    }

    document.getElementById("greeting").textContent = saludo;

    document.getElementById("clock").textContent =
        ahora.toLocaleTimeString(
            "es-ES",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    document.getElementById("date").textContent =
        ahora.toLocaleDateString(
            "es-ES",
            {
                weekday:"long",
                day:"numeric",
                month:"long",
                year:"numeric"
            }
        );
}

actualizarReloj();

setInterval(actualizarReloj,1000);

</script>

</body>
</html>
