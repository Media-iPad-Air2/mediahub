<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Media Hub</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Media Hub">
<meta name="theme-color" content="#020617">

<style>

:root{
    --glass:rgba(255,255,255,.07);
    --glass-hover:rgba(255,255,255,.11);
    --border:rgba(255,255,255,.08);
    --muted:#94a3b8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    sans-serif;

    color:white;

    background:
    radial-gradient(circle at top right,#2563eb25 0%,transparent 25%),
    radial-gradient(circle at bottom left,#7c3aed15 0%,transparent 30%),
    linear-gradient(
        180deg,
        #020617 0%,
        #081229 100%
    );

    overflow:hidden;
}

.container{

    width:100%;
    height:100vh;

    padding:20px 24px;

    display:flex;

    flex-direction:column;
}

/* CABECERA */

.hero{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    margin-bottom:14px;
}

.time-block{

    display:flex;

    flex-direction:column;
}

.greeting{

    color:#e2e8f0;

    font-size:1rem;

    margin-bottom:4px;
}

.clock{

    font-size:4.7rem;

    line-height:.9;

    font-weight:700;

    letter-spacing:-5px;
}

.date{

    margin-top:8px;

    font-size:.95rem;

    color:var(--muted);
}

.weather{

    text-align:right;
}

.temp{

    font-size:2.5rem;

    font-weight:700;
}

.weather-desc{

    font-size:1rem;

    color:#cbd5e1;
}

/* ACCESOS RAPIDOS */

.quick-grid{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:12px;

    margin-bottom:16px;
}

.quick-tile{

    height:85px;

    background:var(--glass);

    border:1px solid var(--border);

    border-radius:22px;

    backdrop-filter:blur(18px);

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-decoration:none;

    color:white;

    transition:.2s;
}

.quick-tile:hover{

    background:var(--glass-hover);

    transform:translateY(-2px);
}

/* MULTIMEDIA */

.media-top{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:16px;

    margin-bottom:16px;
}

.featured{

    height:145px;

    background:var(--glass);

    border:1px solid var(--border);

    border-radius:28px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-decoration:none;

    color:white;

    backdrop-filter:blur(20px);

    transition:.2s;
}

.featured:hover{

    transform:translateY(-3px);

    background:var(--glass-hover);
}

.media-bottom{

    flex:1;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:16px;
}

.media-tile{

    background:var(--glass);

    border:1px solid var(--border);

    border-radius:28px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-decoration:none;

    color:white;

    backdrop-filter:blur(20px);

    transition:.2s;
}

.media-tile:hover{

    transform:translateY(-3px);

    background:var(--glass-hover);
}

/* ICONOS */

.icon{

    width:48px;

    height:48px;

    display:flex;

    justify-content:center;

    align-items:center;

    margin-bottom:10px;

    font-size:2rem;
}

.icon svg{

    width:100%;

    height:100%;

    fill:currentColor;
}

.label{

    font-weight:600;

    font-size:1rem;
}

.sub{

    color:var(--muted);

    font-size:.85rem;

    margin-top:4px;
}

/* BORDES COLOR */

.spotify{
    border-left:4px solid #1DB954;
}

.netflix{
    border-left:4px solid #E50914;
}

.youtube{
    border-left:4px solid #FF0000;
}

.safari{
    border-left:4px solid #2563eb;
}

.<a class="quick-tile hue"
   href="philips-hue://"
   onclick="abrirApp(event,'philips-hue://','https://www.philips-hue.com')">

 <div class="icon">💡</div>

 <div class="label">
  Luces
 </div>

</a>

.casa{
    border-left:4px solid #10b981;
}

.prevision{
    border-left:4px solid #38bdf8;
}

.prime{
    border-left:4px solid #00A8E1;
}

.disney{
    border-left:4px solid #60a5fa;
}

</style>
</head>

<body>

<div class="container">

    <div class="hero">

        <div class="time-block">

            <div id="greeting" class="greeting">
                Buenas tardes
            </div>

            <div id="clock" class="clock">
                00:00
            </div>

            <div id="date" class="date">
            </div>

        </div>

        <div class="weather">

            <div id="temp" class="temp">
                --°
            </div>

            <div id="weatherDesc"
                 class="weather-desc">
                 ...
            </div>

        </div>

    </div>

    <!-- DOMOTICA -->

    <div class="quick-grid">

        <div class="quick-tile hue">

            <div class="icon">💡</div>

            <div class="label">
                Hue
            </div>

        </div>

        <a class="quick-tile casa"
           href="https://www.icloud.com">

            <div class="icon">🏠</div>

            <div class="label">
                Casa
            </div>

        </a>

        <a class="quick-tile safari"
           href="https://www.google.es">

            <div class="icon">🌐</div>

            <div class="label">
                Safari
            </div>

        </a>

        <a class="quick-tile prevision"
           href="https://www.eltiempo.es/aldaia.html">

            <div class="icon">☁️</div>

            <div class="label">
                Previsión
            </div>

        </a>

    </div>

    <!-- PRINCIPAL -->

    <div class="media-top">

        <a class="featured spotify"
           href="https://open.spotify.com">

            <div class="icon">

                <svg viewBox="0 0 24 24">
                    <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.5 17.3c-.2.3-.6.4-.9.2-2.6-1.6-5.8-2-9.7-1.2-.3.1-.7-.2-.8-.5-.1-.4.1-.7.5-.8 4.2-.9 7.8-.4 10.7 1.4.3.2.4.6.2.9z"/>
                </svg>

            </div>

            <div class="label">Spotify</div>
            <div class="sub">Música</div>

        </a>

        <a class="featured netflix"
           href="https://www.netflix.com">

            <div class="icon">
                N
            </div>

            <div class="label">Netflix</div>
            <div class="sub">Series y películas</div>

        </a>

    </div>

    <!-- STREAMING -->

    <div class="media-bottom">

        <a class="media-tile youtube"
           href="https://youtube.com">

            <div class="icon">

                <svg viewBox="0 0 24 24">
                    <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.5 15.5v-7l6 3.5z"/>
                </svg>

            </div>

            <div class="label">YouTube</div>

        </a>

        <a class="media-tile disney"
           href="https://www.disneyplus.com">

            <div class="icon">✦</div>

            <div class="label">Disney+</div>

        </a>

        <a class="media-tile prime"
           href="https://www.primevideo.com">

            <div class="icon">📺</div>

            <div class="label">Prime Video</div>

        </a>

    </div>

</div>

<script>

function actualizarReloj(){

    const ahora = new Date();

    const hora = ahora.getHours();

    let saludo = "Buenas noches";

    if(hora >= 6 && hora < 12){
        saludo = "Buenos días";
    }
    else if(hora >= 12 && hora < 20){
        saludo = "Buenas tardes";
    }

    document.getElementById("greeting").textContent =
        saludo;

    document.getElementById("clock").textContent =
        ahora.toLocaleTimeString(
            "es-ES",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    document.getElementById("date").textContent =
        ahora.toLocaleDateString(
            "es-ES",
            {
                weekday:"long",
                day:"numeric",
                month:"long"
            }
        );
}

async function actualizarTiempo(){

    try{

        const r = await fetch(
          "https://api.open-meteo.com/v1/forecast?latitude=39.465&longitude=-0.461&current=temperature_2m,weather_code"
        );

        const data = await r.json();

        document.getElementById("temp").textContent =
            Math.round(
                data.current.temperature_2m
            ) + "°";

        let texto =
            "Despejado";

        const codigo =
            data.current.weather_code;

        if(codigo >= 1 && codigo <= 3)
            texto = "Poco nuboso";

        if(codigo >= 45)
            texto = "Niebla";

        if(codigo >= 51)
            texto = "Lluvia";

        if(codigo >= 71)
            texto = "Nieve";

        if(codigo >= 95)
            texto = "Tormenta";

        document.getElementById(
            "weatherDesc"
        ).textContent = texto;

    }
    catch(e){

        document.getElementById(
            "weatherDesc"
        ).textContent =
            "Sin conexión";
    }
}

actualizarReloj();
setInterval(actualizarReloj,1000);

actualizarTiempo();
setInterval(actualizarTiempo,600000);

</script>

</body>
</html>
