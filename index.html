<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Media Hub</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Media Hub">
<meta name="theme-color" content="#020617">

<style>

:root{
    --glass:rgba(255,255,255,.08);
    --glass-hover:rgba(255,255,255,.12);
    --border:rgba(255,255,255,.08);
    --muted:#94a3b8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    sans-serif;

    color:#fff;

    background:
    radial-gradient(circle at top right,#2563eb20 0%,transparent 30%),
    radial-gradient(circle at bottom left,#7c3aed20 0%,transparent 35%),
    linear-gradient(
        180deg,
        #020617,
        #0f172a
    );

    overflow:hidden;
}

.container{

    height:100vh;

    padding:24px;

    display:flex;

    flex-direction:column;
}

/* HERO */

.hero{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    margin-bottom:24px;
}

.clock{

    font-size:5.5rem;

    line-height:.9;

    font-weight:700;

    letter-spacing:-5px;
}

.date{

    margin-top:10px;

    color:var(--muted);

    font-size:1rem;
}

.status{

    margin-top:12px;

    display:inline-block;

    padding:10px 16px;

    border-radius:999px;

    background:var(--glass);

    border:1px solid var(--border);
}

.right{

    display:flex;

    flex-direction:column;

    gap:12px;
}

.weather{

    background:var(--glass);

    border:1px solid var(--border);

    border-radius:24px;

    backdrop-filter:blur(16px);

    padding:18px 24px;

    min-width:200px;

    text-align:center;
}

.temp{

    font-size:2.2rem;

    font-weight:700;
}

.city{

    color:#cbd5e1;

    margin-top:4px;
}

.weatherDesc{

    color:var(--muted);

    margin-top:6px;

    font-size:.9rem;
}

/* GRID */

.grid{

    flex:1;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:16px;
}

.tile{

    background:var(--glass);

    border:1px solid var(--border);

    border-radius:28px;

    backdrop-filter:blur(18px);

    text-decoration:none;

    color:white;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    transition:.2s;
}

.tile:hover{

    transform:translateY(-2px);

    background:var(--glass-hover);
}

.wide{
    grid-column:span 2;
}

.icon{

    width:50px;

    height:50px;

    margin-bottom:12px;

    color:white;
}

.icon svg{

    width:100%;

    height:100%;

    display:block;

    fill:currentColor;
}

.label{

    font-size:1rem;

    font-weight:600;
}

.sub{

    margin-top:4px;

    color:var(--muted);

    font-size:.85rem;
}

/* Service colors */

.spotify{
    border-left:4px solid #1DB954;
}

.netflix{
    border-left:4px solid #E50914;
}

.youtube{
    border-left:4px solid #FF0000;
}

.tapo{
    border-left:4px solid #06b6d4;
}

.hue{
    border-left:4px solid #facc15;
}

@media(max-width:1000px){

    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .clock{
        font-size:4rem;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="hero">

        <div>

            <div id="greeting">
                Bienvenido
            </div>

            <div class="clock" id="clock">
                00:00
            </div>

            <div class="date" id="date"></div>

            <div class="status">
                🏠 Aldaia · 📶 Online
            </div>

        </div>

        <div class="right">

            <div class="weather">

                <div id="temp" class="temp">
                    --°
                </div>

                <div class="city">
                    Aldaia
                </div>

                <div id="weatherDesc"
                     class="weatherDesc">
                    Cargando...
                </div>

            </div>

        </div>

    </div>

    <div class="grid">

        <!-- Spotify -->

        <a class="tile wide spotify"
           href="https://open.spotify.com">

            <div class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.5 17.3c-.2.3-.6.4-.9.2-2.6-1.6-5.8-2-9.7-1.2-.3.1-.7-.2-.8-.5-.1-.4.1-.7.5-.8 4.2-.9 7.8-.4 10.7 1.4.3.2.4.6.2.9zm1.3-2.9c-.3.4-.7.5-1.1.3-3-1.8-7.5-2.4-11-.3-.4.2-.9.1-1.1-.3-.2-.4-.1-.9.3-1.1 4-2.4 9-1.7 12.6.5.4.2.5.7.3 1.1zm.1-3.1c-3.6-2.1-9.5-2.3-12.9-.5-.5.3-1 .1-1.3-.3-.2-.5-.1-1 .4-1.3 3.9-2.1 10.3-1.8 14.6.7.5.3.6.8.3 1.4-.3.3-.8.4-1.1 0z"/>
                </svg>
            </div>

            <div class="label">Spotify</div>
            <div class="sub">Música</div>

        </a>

        <!-- Netflix -->

        <a class="tile wide netflix"
           href="https://www.netflix.com">

            <div class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M5 2h4l6 14V2h4v20h-4L9 8v14H5z"/>
                </svg>
            </div>

            <div class="label">Netflix</div>
            <div class="sub">Series y películas</div>

        </a>

        <!-- YouTube -->

        <a class="tile youtube"
           href="https://youtube.com">

            <div class="icon">
                <svg viewBox="0 0 24 24">
                    <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.5 15.5v-7l6 3.5z"/>
                </svg>
            </div>

            <div class="label">YouTube</div>

        </a>

        <!-- Disney -->

        <a class="tile"
           href="https://www.disneyplus.com">

            <div class="icon">
                ★
            </div>

            <div class="label">Disney+</div>

        </a>

        <!-- Prime Video -->

        <a class="tile"
           href="https://www.primevideo.com">

            <div class="icon">
                📺
            </div>

            <div class="label">Prime Video</div>

        </a>

        <!-- Tapo -->

        <a class="tile tapo"
           href="https://www.tapo.com">

            <div class="icon">
                📹
            </div>

            <div class="label">Tapo</div>

        </a>

        <!-- Hue -->

        <div class="tile hue">

            <div class="icon">
                💡
            </div>

            <div class="label">Hue</div>

        </div>

        <!-- Tiempo -->

        <a class="tile"
           href="https://www.eltiempo.es">

            <div class="icon">
                ☁️
            </div>

            <div class="label">Tiempo</div>

        </a>

    </div>

</div>

<script>

function actualizarReloj(){

    const ahora = new Date();

    const hora = ahora.getHours();

    let saludo = "Buenas noches";

    if(hora >= 6 && hora < 12){
        saludo = "Buenos días";
    }
    else if(hora >= 12 && hora < 20){
        saludo = "Buenas tardes";
    }

    document.getElementById("greeting").textContent =
        saludo;

    document.getElementById("clock").textContent =
        ahora.toLocaleTimeString(
            "es-ES",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    document.getElementById("date").textContent =
        ahora.toLocaleDateString(
            "es-ES",
            {
                weekday:"long",
                day:"numeric",
                month:"long"
            }
        );
}

async function actualizarTiempo(){

    try{

        const respuesta =
        await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=39.465&longitude=-0.461&current=temperature_2m,weather_code"
        );

        const datos =
        await respuesta.json();

        document.getElementById(
            "temp"
        ).textContent =
            Math.round(
                datos.current.temperature_2m
            ) + "°";

        let texto = "Despejado";

        const codigo =
        datos.current.weather_code;

        if(codigo >= 1 && codigo <= 3)
            texto = "Poco nuboso";

        if(codigo >= 45)
            texto = "Niebla";

        if(codigo >= 51)
            texto = "Lluvia";

        if(codigo >= 71)
            texto = "Nieve";

        if(codigo >= 95)
            texto = "Tormenta";

        document.getElementById(
            "weatherDesc"
        ).textContent =
            texto;

    }
    catch(e){

        document.getElementById(
            "weatherDesc"
        ).textContent =
            "Sin conexión";

    }

}

actualizarReloj();
setInterval(actualizarReloj,1000);

actualizarTiempo();
setInterval(actualizarTiempo,600000);

</script>

</body>
</html>
